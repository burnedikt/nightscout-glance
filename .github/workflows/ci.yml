name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "docs/**", "*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: NightscoutGlance-windows
          path: target/release/nightscout-glance.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NightscoutGlance-macos
          path: dist/NightscoutGlance-macos.zip
