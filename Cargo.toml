[package]
name = "nightscout-glance"
version = "0.1.0"
edition = "2021"
description = "Your Nightscout CGM value, always in view in the Windows tray."
license = "MIT"
repository = "https://github.com/burnedikt/nightscout-glance"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-systemfonts", "raw-window-handle-06"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
raw-window-handle = "0.6"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography",
    "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading",
    "Win32_System_SystemInformation", "Win32_System_Time",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi",
] }

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.winresource]
ProductName = "Nightscout Glance"
FileDescription = "Nightscout Glance"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.21", default-features = false }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
security-framework = "3"
libc = "0.2"
